services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbite-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbite-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

